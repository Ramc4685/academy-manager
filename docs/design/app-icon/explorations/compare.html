<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CourtMastr App Icon</title>
<style>
:root{--ink:#0f172a;--paper:#f8fafc;--muted:#64748b;--line:#e2e8f0}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Manrope,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font:700 26px Outfit,system-ui,sans-serif;margin:0 0 4px}
.d{border:1px solid var(--line);border-radius:12px;background:#fff;padding:20px;margin:20px 0}
.d h2{font:600 18px Outfit,system-ui,sans-serif;margin:0}
.d p{margin:4px 0 14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.cell{text-align:center;font:10px ui-monospace,monospace;color:var(--muted)}
.ios{border-radius:22.37%;display:block}
.and{border-radius:50%;display:block}
.home{display:flex;gap:18px;padding:18px;border-radius:16px;align-items:flex-start}
.home.light{background:linear-gradient(160deg,#e0e7ff,#fdf2f8)}
.home.dark{background:linear-gradient(160deg,#111827,#1f2937)}
.app{width:60px;text-align:center;font:11px system-ui;color:#111}
.dark .app{color:#f3f4f6}
.dummy{width:60px;height:60px;border-radius:22.37%;background:#94a3b8}
.dummy.g{background:#22c55e}.dummy.r{background:#ef4444}
</style></head><body><main>
<h1>CourtMastr Academy: app icon directions</h1>
<p>All three use the CourtMastr Rally palette: Floodlit Night #0a0f1c, Floodlight Volt #facc15 and Paper #f8fafc. None uses the house academy's yellow "B". The smallest size, 29px, is the iOS Settings icon.</p>
<div id="dirs"></div>
</main>
<script>
const dirs=[
 ["a-shuttle.svg","A · Shuttle","Evolves CourtMastr's own platform ShuttleMark into an icon that reads at small sizes. Strongest brand continuity. Risk: it says badminton, not any racket sport."],
 ["b-service-box.svg","B · Service box","A court plan seen from above, with one service box lit in volt (\"volt marks the line\"). Fits any racket sport. Risk: line work softens at 29px."],
 ["c-court-c.svg","C · Court C","A 'C' for CourtMastr drawn as boundary paint, with the inner line as the service line. Sport-neutral and the most ownable. Risk: monograms are common."]];
document.getElementById('dirs').innerHTML=dirs.map(([f,n,t])=>`<section class="d"><h2>${n}</h2><p>${t}</p>
<div class="row">${[180,120,60,40,29].map(s=>`<div class="cell"><img class="ios" src="${f}" width="${s}" height="${s}" alt=""><br>iOS ${s}</div>`).join('')}
${[96,48].map(s=>`<div class="cell"><img class="and" src="${f}" width="${s}" height="${s}" alt=""><br>Android ${s}</div>`).join('')}</div>
<div class="row" style="margin-top:16px">${['light','dark'].map(m=>`<div class="home ${m}">
<div class="app"><div class="dummy"></div>Mail</div><div class="app"><img class="ios" src="${f}" width="60" height="60" alt=""><span>CourtMastr</span></div><div class="app"><div class="dummy g"></div>Phone</div><div class="app"><div class="dummy r"></div>News</div></div>`).join('')}</div></section>`).join('');
</script></body></html>
