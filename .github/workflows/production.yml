name: Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_ORIGIN: https://api.academy.courtmastr.com
  FRONTEND_ORIGIN: https://academy.courtmastr.com
  BFF_API_ORIGIN: https://api.academy.courtmastr.com
  NEXT_PUBLIC_API_BASE: /api/v2
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
  NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_PROXY || '' }}
  # Browser Sentry (lib/observability/sentry.ts) is DSN-gated and read at
  # build time. The NEXT_PUBLIC_SENTRY_DSN repo variable is deliberately NOT
  # exported here: a workflow-level value reaches the e2e jobs too, where the
  # SDK would post envelopes to Sentry from Playwright runs (the
  # tenant-isolation fixture rejects that as a stray /api/ call, and real
  # events from tests would pollute the project). Only the production build
  # steps in frontend-static and deploy-frontend read the variable directly.
  # The release name must match the sentry-release job's
  # `courtmastr-frontend@<sha>`.
  NEXT_PUBLIC_APP_ENV: production
  NEXT_PUBLIC_SENTRY_RELEASE: courtmastr-frontend@${{ github.sha }}

jobs:
  # Path filters select validation jobs on pull requests only. On a push to
  # main every validation job runs and both components deploy: the filter
  # diffs against the previous push, so when concurrency cancels a queued
  # main run its diff is never evaluated and a later backend-only run used
  # to skip the frontend deploy (2026-08-30: frontend ran ~24h behind).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
      e2e: ${{ steps.filter.outputs.e2e }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/**'
            e2e:
              - 'frontend/e2e/**'
            scripts:
              - 'scripts/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    services:
      mongo:
        # Same major version as production (8.0). The 7.0 and 8.0 query
        # planners differ, so a plan that is index-served here must be one
        # production would also pick (#878, #894).
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REACT_APP_BACKEND_URL: https://api.academy.courtmastr.com
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: academy_test
      JWT_SECRET: ci-test-secret
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: academy-courtmastr-test
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Dependency vulnerability scan
        working-directory: backend
        # PYSEC-2026-1325: ecdsa's known side-channel timing issue has no fixed
        # release (0.19.2 is latest on PyPI); the maintainers won't patch it.
        # Re-evaluate if a fixed version ships.
        # Wrapped so an unreachable advisory database warns instead of blocking
        # the deploy path; nightly-e2e.yml re-runs it strictly. Real findings
        # still fail. See scripts/ci/dependency_audit.sh.
        run: bash "$GITHUB_WORKSPACE/scripts/ci/dependency_audit.sh" pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Compile backend
        working-directory: backend
        run: python -m compileall .

      - name: Import-linter v2 boundaries
        working-directory: backend
        run: lint-imports --config pyproject.toml

      - name: v2 backend tests
        working-directory: backend
        # Ratchet: raise fail-under toward measured coverage whenever it grows; never lower without a tracker note.
        # Measured v2 TOTAL = 87.2% (2429 tests, 2026-07-20); floor set to measured−1 for platform variance.
        run: pytest v2/tests -n auto --override-ini="testpaths=v2/tests" --cov=v2 --cov-report=term-missing:skip-covered --cov-fail-under=86

  backend-advisory:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint v2
        working-directory: backend
        run: ruff check v2

      - name: Ruff format check v2
        working-directory: backend
        run: ruff format --check v2

      - name: Mypy v2 (blocking at frozen baseline)
        # Runs from the repo root so `backend.v2.*` has a single package base
        # (audit C1). Pre-existing errors are frozen in backend/mypy-baseline.txt;
        # only NEW errors fail the build. Burn-down: docs/audit/mypy-baseline.md.
        # --allow-unsynced: env-dependent errors may be absent in CI vs local;
        # a resolved baseline entry must not fail the build, only NEW errors do.
        run: >
          mypy --config-file backend/pyproject.toml -p backend.v2
          | mypy-baseline filter --baseline-path backend/mypy-baseline.txt --allow-unsynced

  frontend-static:
    name: Frontend Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        # See the backend audit step: registry outage -> warning, findings -> fail.
        run: bash "$GITHUB_WORKSPACE/scripts/ci/dependency_audit.sh" pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest unit tests
        run: pnpm test:unit

      - name: Node unit tests
        run: pnpm test:node

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_PROXY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ env.NEXT_PUBLIC_SENTRY_RELEASE }}
        run: pnpm build

      - name: OpenAPI drift check
        run: |
          if [ -f lib/api/openapi.snapshot.json ]; then
            npx openapi-typescript lib/api/openapi.snapshot.json -o /tmp/generated-v2.d.ts
            diff -q lib/api/generated/v2.d.ts /tmp/generated-v2.d.ts || {
              echo "::error::lib/api/generated/v2.d.ts is out of date. Run 'pnpm generate:api' against the committed openapi.snapshot.json."
              exit 1
            }
          else
            echo "No openapi.snapshot.json yet. Skipping drift check."
          fi

  frontend-e2e-chromium:
    name: Frontend E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Playwright E2E Chromium
        env:
          CI: "1"
        run: pnpm exec playwright test --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-chromium-desktop:
    name: Frontend E2E Chromium Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    # Tiered browser matrix (#476): the desktop project skips on PRs unless
    # frontend/e2e/** changed, but always runs on push to main — a regression
    # can merge but never deploy (production-approval requires ci-gate
    # success on the main run). CI Gate treats the PR skip as pass.
    # WebKit no longer runs here: it was the longest job on the pre-deploy
    # critical path (~9 min) and lives in nightly-e2e.yml instead.
    if: >
      (
        github.event_name != 'pull_request' &&
        (
          needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.ci == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push'
        )
      ) ||
      (
        github.event_name == 'pull_request' &&
        needs.changes.outputs.e2e == 'true'
      )
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Playwright E2E Chromium Desktop
        env:
          CI: "1"
        run: pnpm exec playwright test --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-desktop
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-real-auth:
    name: Frontend E2E Real Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.scripts == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    # No `services: mongo:` container here (unlike the `backend` job): GH
    # Actions service containers are exposed via iptables NAT with the
    # userland-proxy disabled, so there's no real host-level listening socket
    # for lsof to find. scripts/local_test_stack.sh detects an already-running
    # Mongo via `lsof -iTCP:27017 -sTCP:LISTEN` (so it can skip spawning its
    # own mongod on a real dev machine) — that check silently reports the port
    # free against a service container, so the script then tries (and fails)
    # to launch mongod itself. Installing mongod as a real process below keeps
    # the script's local-dev assumptions intact.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
      # Emulator-only credentials — not valid against any real account.
      SEED_ADMIN_PASSWORD: e2e-ci-admin-pass
      SEED_COACH_PASSWORD: e2e-ci-coach-pass
      SEED_PARENT_PASSWORD: e2e-ci-parent-pass
      LOCAL_AUTH_ADMIN_PASSWORD: e2e-ci-admin-pass
      LOCAL_AUTH_PARENT_PASSWORD: e2e-ci-parent-pass
      LOCAL_AUTH_BASE_URL: http://localhost:3001
      LOCAL_AUTH_EVIDENCE_DIR: /tmp/real-auth-evidence
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install MongoDB (native mongod binary)
        # supercharge/mongodb-github-action was tried first but also runs Mongo
        # via `docker run` internally — same NAT/lsof-invisibility problem as
        # a `services:` container. Installing the real mongod binary lets
        # scripts/local_test_stack.sh start/detect it itself, exactly as it
        # does on a real dev machine (no separate "start mongo" step needed).
        run: |
          # 8.0 matches production (#894). Unlike 7.0 it has an official
          # `noble` (24.04) apt repo, which is what ubuntu-latest runs.
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server mongodb-mongosh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Java (Firebase Auth emulator requirement)
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        # local_test_stack.sh requires backend/.venv (matches local dev setup).
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Install Firebase CLI (Auth emulator)
        run: npm install -g firebase-tools

      - name: Start local stack (Mongo + Firebase Auth emulator + backend + frontend) and seed
        run: scripts/local_test_stack.sh fresh

      - name: Real-auth smoke spec
        working-directory: frontend
        env:
          CI: "1"
          REAL_AUTH_E2E: "1"
        run: pnpm exec playwright test --config=playwright.ci-real-auth.config.ts

      - name: Dump stack logs on failure
        if: failure()
        run: scripts/local_test_stack.sh logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-auth
          path: /tmp/real-auth-evidence
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: scripts/local_test_stack.sh stop

  # Guards scripts/** (#535): local_test_stack.sh, production_smoke.sh, and
  # publish_release.py previously merged unvalidated and only failed at
  # deploy/release time because no path filter or job covered scripts/**.
  scripts-validate:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: >
      needs.changes.outputs.scripts == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck scripts/**/*.sh
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck -S error

      - name: Byte-compile scripts/**/*.py
        run: |
          find scripts -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Validate workflow YAML
        run: ./actionlint .github/workflows/*.yml

      # scripts/dev/tests/test_release_automation.py is not wired in here: it
      # currently has a pre-existing failing assertion unrelated to #535
      # (reproduced identically on main), so gating on it would newly block
      # every scripts/** PR on an out-of-scope bug. Fix it separately, then
      # add `python3 -m pytest scripts/dev/tests -q` to this job.

  # Guards the pre-push hook's tier classifier (#481). Always runs (no path
  # filter): scripts/** is not covered by any changes filter, and the test
  # takes seconds.
  hook-tests:
    name: Hook Classifier Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run pre-push classifier tests
        run: bash scripts/dev/pre-push-checks.test.sh

  # Aggregate gate: the single required status check for branch protection on
  # main (issue #473). Runs on every PR even when path filters skip individual
  # jobs, so a skipped job counts as pass and a missing run can never be
  # mistaken for success.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        backend,
        backend-advisory,
        frontend-static,
        frontend-e2e-chromium,
        frontend-e2e-chromium-desktop,
        frontend-e2e-real-auth,
        scripts-validate,
        hook-tests,
      ]
    if: always()
    steps:
      - name: Verify no required job failed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$bad" ]; then
            echo "::error::CI Gate failed — job(s) failed or were cancelled: $bad"
            exit 1
          fi
          echo "CI Gate passed — every job succeeded or was skipped by path filters."

  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-gate]
    # ci-gate aggregates every validation job and fails on failure OR
    # cancelled, so requiring its success (not merely "no failure") means a
    # cancelled validation can never proceed toward deployment (#480).
    if: >
      always() &&
      needs.ci-gate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Confirm production deployment
        run: echo "Production deployment approved for ${GITHUB_SHA}"

  migrate-production:
    name: Migrate Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [production-approval]
    if: >
      always() &&
      needs.production-approval.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: courtmastr-academy-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      # Build the backend image ONCE and push it under a label derived from the
      # SHA. The dry run below and deploy-backend both use this exact image, so
      # what was dry-run is what gets deployed. --build-only never touches the
      # running machine and never runs the release_command.
      - name: Build and push backend image
        id: build
        working-directory: backend
        run: |
          label="migrate-${GITHUB_SHA::12}"
          flyctl deploy --build-only --push --remote-only \
            --image-label "${label}" --app "${FLY_APP}"
          image="registry.fly.io/${FLY_APP}:${label}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "::notice::Backend image for this deploy: ${image}"

      # Dry run on a throwaway machine of the app (it receives the app's
      # secrets, so MONGO_URL is available). `flyctl machine run` only waits
      # for the machine to START and never reports the process exit code, so
      # the machine is created detached without --rm, waited on until it
      # stops, its exit code read from `machine status`, its output printed
      # from the log buffer, and then destroyed. The step fails when the exit
      # code is non-zero or cannot be read. The real apply happens inside
      # deploy-backend's `flyctl deploy` via fly.toml's [deploy]
      # release_command, which Fly aborts the deploy on when it exits non-zero.
      #
      # Runs from the repo root on purpose: in backend/ flyctl would auto-load
      # fly.toml and could copy its [http_service] onto this machine. Without
      # fly.toml the machine gets the app's secret values only, so DB_NAME (an
      # [env] value) is read from fly.toml and passed explicitly; APP_ENV is
      # deliberately not set, so the CLI runs with the non-prod settings
      # validators (it needs nothing but the Mongo connection).
      - name: Dry-run pending migrations on the new image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          db_name="$(sed -n 's/^ *DB_NAME *= *"\(.*\)"/\1/p' backend/fly.toml | head -n1)"
          if [ -z "${db_name}" ]; then
            echo "::error::Could not read DB_NAME from backend/fly.toml"
            exit 1
          fi
          out="$(flyctl machine run "${IMAGE}" --app "${FLY_APP}" --region ord \
            --name "migrate-dry-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --restart no --detach --vm-memory 1024 \
            --env "DB_NAME=${db_name}" \
            -- python -m backend.v2.migrations --dry-run 2>&1 | tee /dev/stderr)"
          machine_id="$(printf '%s\n' "${out}" | sed -n 's/.*Machine ID: *\([0-9a-f]\{14\}\).*/\1/p' | head -n1)"
          if [ -z "${machine_id}" ]; then
            echo "::error::Could not read the dry-run machine id from flyctl output"
            exit 1
          fi
          echo "dry-run machine: ${machine_id}"
          cleanup() { flyctl machine destroy "${machine_id}" --app "${FLY_APP}" --force || true; }
          trap cleanup EXIT
          flyctl machine wait "${machine_id}" --app "${FLY_APP}" --state stopped --wait-timeout 10m
          echo "--- dry-run output ---"
          flyctl logs --app "${FLY_APP}" --machine "${machine_id}" --no-tail || true
          echo "--- machine status ---"
          status="$(flyctl machine status "${machine_id}" --app "${FLY_APP}" | tee /dev/stderr)"
          exit_code="$(printf '%s\n' "${status}" | grep -o 'exit_code=[0-9]*' | tail -n1 | cut -d= -f2)"
          if [ -z "${exit_code}" ]; then
            echo "::error::Could not read the dry-run exit code from machine status"
            exit 1
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "::error::Migrations dry run exited ${exit_code}; deploy-backend is skipped"
            exit "${exit_code}"
          fi
          echo "Migrations dry run passed on ${IMAGE}"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    # Includes the migrations apply (release_command, up to 25 min) on top of
    # the deploy itself; the image was already built by migrate-production.
    timeout-minutes: 40
    needs: [production-approval, migrate-production]
    if: >
      always() &&
      needs.production-approval.result == 'success' &&
      needs.migrate-production.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy backend to Fly
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --image: deploy the SAME image migrate-production built and dry-ran;
        # nothing is rebuilt here. Fly runs fly.toml's [deploy] release_command
        # (python -m backend.v2.migrations) on this image first and aborts the
        # deploy if it exits non-zero, leaving the old machine serving.
        # --release-command-timeout: above the CLI's own 20 min budget so a
        # stuck migrations lease fails inside the CLI with a readable log.
        # --ha=false: this app runs one machine on purpose (in-process
        # scheduler). The default --ha would create two machines whenever the
        # group is at zero, doubling the bill and the jobs.
        # SENTRY_RELEASE: resolve_release() in backend/v2/shared/observability/
        # errors.py reads this before FLY_IMAGE_REF, so every deploy reports the
        # same release name the sentry-release job below creates.
        run: >
          flyctl deploy --image ${{ needs.migrate-production.outputs.image }}
          --release-command-timeout 25m
          --ha=false --app courtmastr-academy-api
          --env SENTRY_RELEASE=courtmastr-fastapi@${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [production-approval]
    if: >
      always() &&
      needs.production-approval.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy frontend to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_PROXY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ env.NEXT_PUBLIC_SENTRY_RELEASE }}
        run: |
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN}" ]; then
            echo "::notice::NEXT_PUBLIC_SENTRY_DSN is not set; the frontend build ships without browser Sentry."
          else
            echo "::notice::Browser Sentry enabled: release ${NEXT_PUBLIC_SENTRY_RELEASE}, environment ${NEXT_PUBLIC_APP_ENV}."
          fi
          pnpm deploy:cloudflare

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-backend, deploy-frontend]
    if: >
      always() &&
      needs.deploy-backend.result == 'success' &&
      needs.deploy-frontend.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run production smoke checks
        env:
          API_URL: ${{ env.API_ORIGIN }}
          FRONTEND_URL: ${{ env.FRONTEND_ORIGIN }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          # Per-tenant hosts served by the same Worker + API; each is checked for
          # HTML, BFF health and CORS (the 2026-09-01 checkout CORS defect was on
          # this host and the primary-only smoke passed).
          TENANT_FRONTEND_URLS: https://blno-academy.courtmastr.com
        run: scripts/smoke/production_smoke.sh

  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke]
    if: >
      needs.smoke.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    env:
      # The courtmastr-frontend Sentry project and the NEXT_PUBLIC_SENTRY_DSN
      # repo variable exist (2026-09-05); set to "false" to pause. The Worker build
      # already stamps NEXT_PUBLIC_SENTRY_RELEASE=courtmastr-frontend@<sha>
      # (workflow-level env), which is the name the browser SDK reports.
      ENABLE_FRONTEND_SENTRY_RELEASE: "true"
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # set_commits: auto needs the full history to diff against the
          # previous release.
          fetch-depth: 0
          persist-credentials: false

      # Secrets cannot be referenced in `if:`, so the step below decides whether
      # the SENTRY_AUTH_TOKEN repo secret exists. Until it does, both release
      # steps skip and the workflow stays green (see DEPLOYMENT.md, "Sentry
      # releases").
      - name: Check for Sentry auth token
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "${SENTRY_AUTH_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN is not set; skipping Sentry release creation."
          fi

      - name: Create backend Sentry release
        if: steps.sentry.outputs.has_token == 'true'
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: blno-badmintion
          SENTRY_PROJECT: courtmastr-fastapi
        with:
          environment: production
          release: courtmastr-fastapi@${{ github.sha }}
          set_commits: auto

      # Frontend mirror for the courtmastr-frontend Sentry project; a no-op
      # while the job-level ENABLE_FRONTEND_SENTRY_RELEASE is "false". The
      # Worker build already receives NEXT_PUBLIC_SENTRY_RELEASE with the same
      # name; keep the two in step or events will not join their release.
      - name: Create frontend Sentry release
        if: >
          steps.sentry.outputs.has_token == 'true' &&
          env.ENABLE_FRONTEND_SENTRY_RELEASE == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: blno-badmintion
          SENTRY_PROJECT: courtmastr-frontend
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        with:
          environment: production
          release: courtmastr-frontend@${{ github.sha }}
          set_commits: auto

  publish-release:
    name: Publish Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke]
    if: >
      needs.smoke.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish SHA-pinned production release record
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/dev/publish_release.py
