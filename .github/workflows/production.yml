name: Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_ORIGIN: https://api.academy.courtmastr.com
  FRONTEND_ORIGIN: https://academy.courtmastr.com
  BFF_API_ORIGIN: https://api.academy.courtmastr.com
  NEXT_PUBLIC_API_BASE: /api/v2
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
  NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_PROXY || '' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REACT_APP_BACKEND_URL: https://api.academy.courtmastr.com
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: academy_test
      JWT_SECRET: ci-test-secret
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: academy-courtmastr-test
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency vulnerability scan
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Compile backend
        working-directory: backend
        run: python -m compileall .

      - name: Import-linter v2 boundaries
        working-directory: backend
        run: lint-imports --config pyproject.toml

      - name: v2 backend tests
        working-directory: backend
        run: pytest v2/tests --override-ini="testpaths=v2/tests" --cov=v2/shared --cov-report=term-missing --cov-fail-under=70

  backend-advisory:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint v2
        working-directory: backend
        run: ruff check v2

      - name: Ruff format check v2
        working-directory: backend
        run: ruff format --check v2

      - name: Mypy v2
        working-directory: backend
        continue-on-error: true
        run: mypy --config-file pyproject.toml v2

  frontend-static:
    name: Frontend Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_PROXY }}
        run: pnpm build

      - name: OpenAPI drift check
        run: |
          if [ -f lib/api/openapi.snapshot.json ]; then
            npx openapi-typescript lib/api/openapi.snapshot.json -o /tmp/generated-v2.d.ts
            diff -q lib/api/generated/v2.d.ts /tmp/generated-v2.d.ts || {
              echo "::error::lib/api/generated/v2.d.ts is out of date. Run 'pnpm generate:api' against the committed openapi.snapshot.json."
              exit 1
            }
          else
            echo "No openapi.snapshot.json yet. Skipping drift check."
          fi

      - name: Size limit
        continue-on-error: true
        run: pnpm size

      - name: Lighthouse CI
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -f .lighthouserc.json ]; then
            pnpm lhci
          else
            echo "No Lighthouse config yet; skipping."
          fi

  frontend-e2e-chromium:
    name: Frontend E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E Chromium
        env:
          CI: "1"
        run: pnpm exec playwright test --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-webkit:
    name: Frontend E2E WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: Playwright E2E WebKit
        env:
          CI: "1"
        run: pnpm exec playwright test --project=webkit-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: frontend/playwright-report
          retention-days: 7

  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        backend,
        frontend-static,
        frontend-e2e-chromium,
        frontend-e2e-webkit,
        backend-advisory,
        changes,
      ]
    if: >
      always() &&
      needs.backend.result != 'failure' &&
      needs.frontend-static.result != 'failure' &&
      needs.frontend-e2e-chromium.result != 'failure' &&
      needs.frontend-e2e-webkit.result != 'failure' &&
      needs.backend-advisory.result != 'failure' &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Confirm production deployment
        run: echo "Production deployment approved for ${GITHUB_SHA}"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [production-approval, changes]
    if: >
      needs.production-approval.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy backend to Fly
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app courtmastr-academy-api

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [production-approval, changes]
    if: >
      needs.production-approval.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Retire legacy Pages frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pages_projects="$(npx wrangler@4 pages project list)"
          printf '%s\n' "$pages_projects"
          if printf '%s\n' "$pages_projects" | grep -qw 'courtmastr-academy'; then
            echo "Detaching academy.courtmastr.com from legacy Pages project."
            detach_response_file="$(mktemp)"
            detach_status="$(
              curl -sS -o "$detach_response_file" -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/courtmastr-academy/domains/academy.courtmastr.com"
            )"
            detach_response="$(cat "$detach_response_file")"
            rm -f "$detach_response_file"
            printf '%s\n' "$detach_response"
            detach_success="$(printf '%s\n' "$detach_response" | jq -r '.success // false')"
            if [ "$detach_status" = "404" ]; then
              echo "academy.courtmastr.com is already detached from courtmastr-academy."
            elif [ "$detach_success" != "true" ]; then
              detach_error="$(printf '%s\n' "$detach_response" | jq -r '.errors[0].message // "unknown Cloudflare error"')"
              echo "::error::Failed to detach academy.courtmastr.com from courtmastr-academy Pages project. HTTP ${detach_status}: ${detach_error}"
              exit 1
            fi
            npx wrangler@4 pages project delete courtmastr-academy --yes
          else
            echo "Legacy Pages project courtmastr-academy is already absent."
          fi

      - name: Retire legacy edge router route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 delete academy-edge-router --force || true

      - name: Deploy frontend to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_PROXY }}
        run: pnpm deploy:cloudflare

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-backend, deploy-frontend]
    if: >
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run production smoke checks
        env:
          API_URL: ${{ env.API_ORIGIN }}
          FRONTEND_URL: ${{ env.FRONTEND_ORIGIN }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: scripts/smoke/production_smoke.sh
