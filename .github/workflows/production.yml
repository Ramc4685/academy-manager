name: Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_ORIGIN: https://api.academy.courtmastr.com
  FRONTEND_ORIGIN: https://academy.courtmastr.com
  BFF_API_ORIGIN: https://api.academy.courtmastr.com
  NEXT_PUBLIC_API_BASE: /api/v2
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REACT_APP_BACKEND_URL: https://api.academy.courtmastr.com
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: academy_test
      JWT_SECRET: ci-test-secret
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: academy-courtmastr-test
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-v2.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-v2.txt

      - name: Compile backend
        working-directory: backend
        run: python -m compileall .

      - name: Import-linter v2 boundaries
        working-directory: backend
        run: lint-imports --config pyproject.toml

      - name: Legacy backend tests
        working-directory: backend
        run: pytest --ignore=tests/backend_test.py --ignore=tests/iter2_test.py --ignore=tests/iter3_test.py --ignore=tests/iter4_test.py --ignore=tests/iter5_test.py --ignore=v2 -q

      - name: v2 backend tests
        working-directory: backend
        run: pytest v2/tests --override-ini="testpaths=v2/tests" --cov=v2/shared --cov-report=term-missing --cov-fail-under=70

  backend-advisory:
    name: Backend Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-v2.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-v2.txt

      - name: Ruff lint v2
        working-directory: backend
        continue-on-error: true
        run: ruff check v2

      - name: Ruff format check v2
        working-directory: backend
        continue-on-error: true
        run: ruff format --check v2

      - name: Mypy v2
        working-directory: backend
        continue-on-error: true
        run: mypy --config-file pyproject.toml v2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend-next/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: pnpm build

      - name: OpenAPI drift check
        run: |
          if [ -f lib/api/openapi.snapshot.json ]; then
            npx openapi-typescript lib/api/openapi.snapshot.json -o /tmp/generated-v2.d.ts
            diff -q lib/api/generated/v2.d.ts /tmp/generated-v2.d.ts || {
              echo "::error::lib/api/generated/v2.d.ts is out of date. Run 'pnpm generate:api' against the committed openapi.snapshot.json."
              exit 1
            }
          else
            echo "No openapi.snapshot.json yet. Skipping drift check."
          fi

      - name: Size limit
        continue-on-error: true
        run: pnpm size

      - name: Lighthouse CI
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -f .lighthouserc.json ]; then
            pnpm lhci
          else
            echo "No Lighthouse config yet; skipping."
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Playwright E2E
        env:
          CI: "1"
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-next/playwright-report
          retention-days: 7

  edge:
    name: Edge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install edge test dependencies
        run: npm install --no-save tsx@4 typescript@5

      - name: Routing table tests
        run: npx tsx router.test.ts

  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, frontend, edge]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Confirm production deployment
        run: echo "Production deployment approved for ${GITHUB_SHA}"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: production-approval
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy backend to Fly
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app courtmastr-academy-api

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend-next/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy frontend to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: pnpm deploy:cloudflare

  deploy-edge:
    name: Deploy Edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy edge router to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config edge/wrangler.toml --env prod

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-edge
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run production smoke checks
        env:
          API_URL: ${{ env.API_ORIGIN }}
          FRONTEND_URL: ${{ env.FRONTEND_ORIGIN }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: scripts/smoke/production_smoke.sh
