name: Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_ORIGIN: https://api.academy.courtmastr.com
  FRONTEND_ORIGIN: https://academy.courtmastr.com
  BFF_API_ORIGIN: https://api.academy.courtmastr.com
  NEXT_PUBLIC_API_BASE: /api/v2
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
  NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_PROXY || '' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REACT_APP_BACKEND_URL: https://api.academy.courtmastr.com
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: academy_test
      JWT_SECRET: ci-test-secret
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: academy-courtmastr-test
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Dependency vulnerability scan
        working-directory: backend
        # PYSEC-2026-1325: ecdsa's known side-channel timing issue has no fixed
        # release (0.19.2 is latest on PyPI); the maintainers won't patch it.
        # Re-evaluate if a fixed version ships.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Compile backend
        working-directory: backend
        run: python -m compileall .

      - name: Import-linter v2 boundaries
        working-directory: backend
        run: lint-imports --config pyproject.toml

      - name: v2 backend tests
        working-directory: backend
        # Ratchet: raise fail-under toward measured coverage whenever it grows; never lower without a tracker note.
        # Measured v2 TOTAL = 87.2% (2429 tests, 2026-07-20); floor set to measured−1 for platform variance.
        run: pytest v2/tests --override-ini="testpaths=v2/tests" --cov=v2 --cov-report=term-missing:skip-covered --cov-fail-under=86

  backend-advisory:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint v2
        working-directory: backend
        run: ruff check v2

      - name: Ruff format check v2
        working-directory: backend
        run: ruff format --check v2

      - name: Mypy v2 (blocking at frozen baseline)
        # Runs from the repo root so `backend.v2.*` has a single package base
        # (audit C1). Pre-existing errors are frozen in backend/mypy-baseline.txt;
        # only NEW errors fail the build. Burn-down: docs/audit/mypy-baseline.md.
        # --allow-unsynced: env-dependent errors may be absent in CI vs local;
        # a resolved baseline entry must not fail the build, only NEW errors do.
        run: >
          mypy --config-file backend/pyproject.toml -p backend.v2
          | mypy-baseline filter --baseline-path backend/mypy-baseline.txt --allow-unsynced

  frontend-static:
    name: Frontend Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_PROXY }}
        run: pnpm build

      - name: OpenAPI drift check
        run: |
          if [ -f lib/api/openapi.snapshot.json ]; then
            npx openapi-typescript lib/api/openapi.snapshot.json -o /tmp/generated-v2.d.ts
            diff -q lib/api/generated/v2.d.ts /tmp/generated-v2.d.ts || {
              echo "::error::lib/api/generated/v2.d.ts is out of date. Run 'pnpm generate:api' against the committed openapi.snapshot.json."
              exit 1
            }
          else
            echo "No openapi.snapshot.json yet. Skipping drift check."
          fi

      - name: Size limit
        continue-on-error: true
        run: pnpm size

      - name: Lighthouse CI
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -f .lighthouserc.json ]; then
            pnpm lhci
          else
            echo "No Lighthouse config yet; skipping."
          fi

  frontend-e2e-chromium:
    name: Frontend E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E Chromium
        env:
          CI: "1"
        run: pnpm exec playwright test --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-chromium-desktop:
    name: Frontend E2E Chromium Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E Chromium Desktop
        env:
          CI: "1"
        run: pnpm exec playwright test --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-desktop
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-webkit:
    name: Frontend E2E WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install webkit

      - name: Playwright E2E WebKit
        env:
          CI: "1"
        run: pnpm exec playwright test --project=webkit-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-real-auth:
    name: Frontend E2E Real Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    # No `services: mongo:` container here (unlike the `backend` job): GH
    # Actions service containers are exposed via iptables NAT with the
    # userland-proxy disabled, so there's no real host-level listening socket
    # for lsof to find. scripts/local_test_stack.sh detects an already-running
    # Mongo via `lsof -iTCP:27017 -sTCP:LISTEN` (so it can skip spawning its
    # own mongod on a real dev machine) — that check silently reports the port
    # free against a service container, so the script then tries (and fails)
    # to launch mongod itself. Installing mongod as a real process below keeps
    # the script's local-dev assumptions intact.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
      # Emulator-only credentials — not valid against any real account.
      SEED_ADMIN_PASSWORD: e2e-ci-admin-pass
      SEED_COACH_PASSWORD: e2e-ci-coach-pass
      SEED_PARENT_PASSWORD: e2e-ci-parent-pass
      LOCAL_AUTH_ADMIN_PASSWORD: e2e-ci-admin-pass
      LOCAL_AUTH_PARENT_PASSWORD: e2e-ci-parent-pass
      LOCAL_AUTH_BASE_URL: http://localhost:3001
      LOCAL_AUTH_EVIDENCE_DIR: /tmp/real-auth-evidence
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install MongoDB (native mongod binary)
        # supercharge/mongodb-github-action was tried first but also runs Mongo
        # via `docker run` internally — same NAT/lsof-invisibility problem as
        # a `services:` container. Installing the real mongod binary lets
        # scripts/local_test_stack.sh start/detect it itself, exactly as it
        # does on a real dev machine (no separate "start mongo" step needed).
        run: |
          curl -fsSL https://pgp.mongodb.com/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          # MongoDB 7.0 has no official `noble` (24.04) apt repo yet; `jammy`
          # packages install and run fine on noble runners.
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server mongodb-mongosh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Java (Firebase Auth emulator requirement)
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        # local_test_stack.sh requires backend/.venv (matches local dev setup).
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Firebase CLI (Auth emulator)
        run: npm install -g firebase-tools

      - name: Start local stack (Mongo + Firebase Auth emulator + backend + frontend) and seed
        run: scripts/local_test_stack.sh fresh

      - name: Real-auth smoke spec
        working-directory: frontend
        env:
          CI: "1"
          REAL_AUTH_E2E: "1"
        run: pnpm exec playwright test --config=playwright.ci-real-auth.config.ts

      - name: Dump stack logs on failure
        if: failure()
        run: scripts/local_test_stack.sh logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-auth
          path: /tmp/real-auth-evidence
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: scripts/local_test_stack.sh stop

  # Aggregate gate: the single required status check for branch protection on
  # main (issue #473). Runs on every PR even when path filters skip individual
  # jobs, so a skipped job counts as pass and a missing run can never be
  # mistaken for success.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        backend,
        backend-advisory,
        frontend-static,
        frontend-e2e-chromium,
        frontend-e2e-chromium-desktop,
        frontend-e2e-webkit,
        frontend-e2e-real-auth,
      ]
    if: always()
    steps:
      - name: Verify no required job failed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$bad" ]; then
            echo "::error::CI Gate failed — job(s) failed or were cancelled: $bad"
            exit 1
          fi
          echo "CI Gate passed — every job succeeded or was skipped by path filters."

  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        backend,
        frontend-static,
        frontend-e2e-chromium,
        frontend-e2e-chromium-desktop,
        frontend-e2e-webkit,
        frontend-e2e-real-auth,
        backend-advisory,
        changes,
      ]
    if: >
      always() &&
      needs.backend.result != 'failure' &&
      needs.frontend-static.result != 'failure' &&
      needs.frontend-e2e-chromium.result != 'failure' &&
      needs.frontend-e2e-chromium-desktop.result != 'failure' &&
      needs.frontend-e2e-webkit.result != 'failure' &&
      needs.frontend-e2e-real-auth.result != 'failure' &&
      needs.backend-advisory.result != 'failure' &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Confirm production deployment
        run: echo "Production deployment approved for ${GITHUB_SHA}"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [production-approval, changes]
    if: >
      always() &&
      needs.production-approval.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy backend to Fly
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app courtmastr-academy-api

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [production-approval, changes]
    if: >
      always() &&
      needs.production-approval.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Retire legacy Pages frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pages_projects="$(npx wrangler@4 pages project list)"
          printf '%s\n' "$pages_projects"
          if printf '%s\n' "$pages_projects" | grep -qw 'courtmastr-academy'; then
            echo "Detaching academy.courtmastr.com from legacy Pages project."
            detach_response_file="$(mktemp)"
            detach_status="$(
              curl -sS -o "$detach_response_file" -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/courtmastr-academy/domains/academy.courtmastr.com"
            )"
            detach_response="$(cat "$detach_response_file")"
            rm -f "$detach_response_file"
            printf '%s\n' "$detach_response"
            detach_success="$(printf '%s\n' "$detach_response" | jq -r '.success // false')"
            if [ "$detach_status" = "404" ]; then
              echo "academy.courtmastr.com is already detached from courtmastr-academy."
            elif [ "$detach_success" != "true" ]; then
              detach_error="$(printf '%s\n' "$detach_response" | jq -r '.errors[0].message // "unknown Cloudflare error"')"
              echo "::error::Failed to detach academy.courtmastr.com from courtmastr-academy Pages project. HTTP ${detach_status}: ${detach_error}"
              exit 1
            fi
            npx wrangler@4 pages project delete courtmastr-academy --yes
          else
            echo "Legacy Pages project courtmastr-academy is already absent."
          fi

      - name: Retire legacy edge router route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 delete academy-edge-router --force || true

      - name: Deploy frontend to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BFF_API_ORIGIN: ${{ env.BFF_API_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ env.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${{ env.NEXT_PUBLIC_FIREBASE_AUTH_PROXY }}
        run: pnpm deploy:cloudflare

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, deploy-backend, deploy-frontend]
    if: >
      always() &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        needs.deploy-backend.result == 'success' ||
        (needs.changes.outputs.backend != 'true' && github.event_name != 'workflow_dispatch')
      ) &&
      (
        needs.deploy-frontend.result == 'success' ||
        (needs.changes.outputs.frontend != 'true' && github.event_name != 'workflow_dispatch')
      ) &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run production smoke checks
        env:
          API_URL: ${{ env.API_ORIGIN }}
          FRONTEND_URL: ${{ env.FRONTEND_ORIGIN }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: scripts/smoke/production_smoke.sh

  publish-release:
    name: Publish Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke]
    if: >
      needs.smoke.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish SHA-pinned production release record
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/dev/publish_release.py
