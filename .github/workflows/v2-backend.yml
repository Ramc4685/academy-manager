name: v2-backend

on:
  pull_request:
    paths:
      - "backend/v2/**"
      - "backend/pyproject.toml"
      - "backend/requirements-v2.txt"
      - ".github/workflows/v2-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/v2/**"
      - "backend/pyproject.toml"
      - "backend/requirements-v2.txt"
      - ".github/workflows/v2-backend.yml"

permissions:
  contents: read

jobs:
  quality:
    name: lint + types + layering + tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-v2.txt

      - name: Install deps
        working-directory: backend
        # Install legacy + v2 deps SEQUENTIALLY. The combined-flags form
        # `pip install -r req1 -r req2` triggers pip's strict resolver
        # which fails on a pre-existing google-api-core[grpc] conflict
        # internal to legacy requirements.txt. Sequential installs sidestep
        # it (pip falls back to per-file resolution).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-v2.txt

      - name: Ruff lint
        working-directory: backend
        # informational for now — strict-mode style isn't ratcheted yet
        continue-on-error: true
        run: ruff check v2

      - name: Ruff format check
        working-directory: backend
        continue-on-error: true
        run: ruff format --check v2

      - name: Mypy
        working-directory: backend
        # informational — 150 strict-mode errors remain to clean up per
        # the commit log; not blocking until ratcheted.
        continue-on-error: true
        run: mypy --config-file pyproject.toml v2

      - name: Import-linter (ADR-0005 + ADR-0006 layering rules)
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: lint-imports --config pyproject.toml

      - name: Pytest with coverage
        working-directory: backend
        # `--override-ini="testpaths=v2/tests"` ensures pytest collects
        # only v2 tests, not legacy. PYTHONPATH=.. lets v2's
        # `from backend.v2.*` imports resolve from repo root.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest v2/tests --override-ini="testpaths=v2/tests" --cov=v2/shared --cov-report=term-missing --cov-fail-under=80
