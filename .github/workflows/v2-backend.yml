name: v2-backend

on:
  pull_request:
    paths:
      - "backend/v2/**"
      - "backend/pyproject.toml"
      - "backend/requirements-v2.txt"
      - ".github/workflows/v2-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/v2/**"
      - "backend/pyproject.toml"
      - "backend/requirements-v2.txt"
      - ".github/workflows/v2-backend.yml"

permissions:
  contents: read

jobs:
  quality:
    name: lint + types + layering + tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-v2.txt

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-v2.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check v2

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check v2

      - name: Mypy
        working-directory: backend
        run: mypy v2

      - name: Import-linter (ADR-0005 + ADR-0006 layering rules)
        working-directory: backend
        run: lint-imports --config pyproject.toml

      - name: Pytest with coverage
        working-directory: backend
        run: |
          pytest v2/tests --cov=v2/shared --cov-report=term-missing --cov-fail-under=80
