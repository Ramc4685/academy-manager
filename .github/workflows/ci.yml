name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      REACT_APP_BACKEND_URL: https://api.academy.courtmastr.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall .

      - name: Run tests
        # backend_test.py / iter2-5_test.py require a live running server (they
        # use requests against REACT_APP_BACKEND_URL). Exclude them here and run
        # only the mongomock-based unit tests that execute without a real server.
        run: pytest tests/test_firebase_auth.py tests/test_seed_users.py tests/test_stripe_webhook_idempotency.py tests/test_onboarding.py tests/test_coach_today.py tests/test_onboarding_checkout.py tests/test_admin_waitlist.py tests/test_payment_undo_and_refund.py -v
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: academy_test
          JWT_SECRET: ci-test-secret
          FIREBASE_AUTH_ENABLED: "true"
          FIREBASE_PROJECT_ID: academy-courtmastr-test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: CI=true yarn test --watchAll=false

      - name: Build
        env:
          REACT_APP_BACKEND_URL: https://api.academy.courtmastr.com
        run: yarn build
