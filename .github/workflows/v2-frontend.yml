name: v2-frontend

on:
  pull_request:
    paths:
      - "frontend-next/**"
      - ".github/workflows/v2-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend-next/**"
      - ".github/workflows/v2-frontend.yml"

permissions:
  contents: read
  pull-requests: write  # for Lighthouse / size-limit PR comments

jobs:
  build:
    name: typecheck + lint + build + size + lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend-next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: OpenAPI drift check
        run: |
          # Regenerate against a snapshot OpenAPI committed under
          # frontend-next/lib/api/openapi.snapshot.json. If the regenerated
          # types differ from the committed file, the PR must regenerate.
          if [ -f lib/api/openapi.snapshot.json ]; then
            npx openapi-typescript lib/api/openapi.snapshot.json -o /tmp/generated-v2.d.ts
            diff -q lib/api/generated/v2.d.ts /tmp/generated-v2.d.ts || {
              echo "::error::lib/api/generated/v2.d.ts is out of date. Run 'pnpm generate:api' against the committed openapi.snapshot.json."
              exit 1
            }
          else
            echo "No openapi.snapshot.json yet (Phase 0 placeholder). Skipping drift check."
          fi

      - name: Size limit
        # Informational until Wave-1A baselines populate real budgets (W1A-01).
        continue-on-error: true
        run: pnpm size

      - name: Lighthouse CI
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -f .lighthouserc.json ]; then
            pnpm lhci
          else
            echo "Lighthouse config not yet present; skipping."
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Playwright E2E
        run: pnpm e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-next/playwright-report
          retention-days: 7
