name: Restore Drill

# Weekly proof that a Mongo backup made by backend/scripts/backup_restore.py
# restores into a scratch database with the same collections, document counts
# and index names (roadmap D6, docs/runbooks/backup-restore.md). Runs entirely
# against a throwaway mongo:8.0 service container: no secrets, no production
# access. It is NOT a production backup job.

on:
  schedule:
    # Mondays 10:30 UTC (05:30 America/Chicago).
    - cron: "30 10 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/scripts/backup_restore.py"
      - "backend/v2/tests/unit/test_backup_restore.py"
      - "backend/v2/tests/contract/test_backup_restore_roundtrip.py"
      - "docs/runbooks/backup-restore.md"
      - ".github/workflows/restore-drill.yml"

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  drill:
    name: Backup / restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        # Same major version as production.
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Local, credential-free service container only.
      MONGO_URL: mongodb://localhost:27017
      SCRATCH_MONGO_URL: mongodb://localhost:27017
      DB_NAME: academy_test
      JWT_SECRET: ci-test-secret
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: academy-courtmastr-test
      V2_ENV: test
      V2_MONGO_URL: mongodb://localhost:27017
      V2_MONGO_DB: academy_v2_test
      V2_DEFAULT_ACADEMY_ID: test-academy
      V2_RUN_MIGRATIONS_ON_BOOT: "false"
      PYTHONPATH: ${{ github.workspace }}
      DRILL_SOURCE_DB: drill_source
      DRILL_TARGET_DB: drill_restore
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install MongoDB Database Tools (mongodump / mongorestore)
        # Same apt repo as the real-auth e2e job. The key download has flaked
        # before, so retry it rather than fail the drill on a network blip.
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg; then
              break
            fi
            echo "key download failed (attempt $attempt)"; sleep 10
          done
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
          mongodump --version
          mongorestore --version

      - name: Script tests (unit + real-mongod round trip)
        working-directory: backend
        run: |
          pytest v2/tests/unit/test_backup_restore.py \
                 v2/tests/contract/test_backup_restore_roundtrip.py \
                 --override-ini="testpaths=v2/tests" -q -rs

      - name: Seed a small tenant-scoped database (every migration + synthetic rows)
        run: |
          python - <<'PY'
          import asyncio, os
          from motor.motor_asyncio import AsyncIOMotorClient
          from backend.v2.migrations import runner

          async def main() -> None:
              client = AsyncIOMotorClient(os.environ["MONGO_URL"])
              db = client[os.environ["DRILL_SOURCE_DB"]]
              for module in runner._discover_migrations():
                  await module.up(db)
              for academy in ("drill-academy", "drill-other-academy"):
                  await db["academies"].insert_one({"_id": academy, "academy_id": academy, "display_name": f"{academy} (synthetic)"})
                  await db["students"].insert_many([
                      {"academy_id": academy, "student_id": f"{academy}-stu-{i}", "parent_id": f"{academy}-par-1", "full_name": f"Test Student {i}"}
                      for i in range(3)
                  ])
                  await db["sessions"].insert_one({"academy_id": academy, "session_id": f"{academy}-ses-1", "name": "Drill Group"})
              names = await db.list_collection_names()
              print(f"seeded {os.environ['DRILL_SOURCE_DB']}: {len(names)} collections")
              client.close()

          asyncio.run(main())
          PY

      - name: Backup
        run: |
          python backend/scripts/backup_restore.py backup \
            --uri-env MONGO_URL --db "$DRILL_SOURCE_DB" --out-dir "$RUNNER_TEMP/backups"

      - name: Restore into a different database name
        run: |
          archive="$(ls "$RUNNER_TEMP"/backups/*.archive.gz)"
          python backend/scripts/backup_restore.py restore \
            --archive "$archive" --target-uri-env SCRATCH_MONGO_URL \
            --nsFrom "$DRILL_SOURCE_DB" --nsTo "$DRILL_TARGET_DB"

      - name: Verify counts and index names against the manifest
        run: |
          manifest="$(ls "$RUNNER_TEMP"/backups/*.manifest.json)"
          python backend/scripts/backup_restore.py verify \
            --manifest "$manifest" --target-uri-env SCRATCH_MONGO_URL --db "$DRILL_TARGET_DB"

      - name: Guard refuses a non-localhost target by default
        env:
          REMOTE_MONGO_URL: mongodb://drill-user:not-a-real-password@scratch.example.invalid:27017
        run: |
          archive="$(ls "$RUNNER_TEMP"/backups/*.archive.gz)"
          set +e
          python backend/scripts/backup_restore.py restore \
            --archive "$archive" --target-uri-env REMOTE_MONGO_URL \
            --nsFrom "$DRILL_SOURCE_DB" --nsTo other_restore > "$RUNNER_TEMP/guard.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/guard.log"
          test "$code" -eq 2
          grep -q "not localhost" "$RUNNER_TEMP/guard.log"
          if grep -q "not-a-real-password" "$RUNNER_TEMP/guard.log"; then
            echo "password leaked into output"; exit 1
          fi

      - name: Retention prune (dry run)
        run: python backend/scripts/backup_restore.py prune --out-dir "$RUNNER_TEMP/backups" --keep-days 30
