packages:
  - "."

minimumReleaseAge: 0

overrides:
  '@grpc/grpc-js': 1.9.16
  esbuild: 0.28.1
  tmp: 0.2.7
  'miniflare>ws': 8.21.0
  undici: ^7.28.0
  # CVE-2026-33327/33328/35590/35591 (libvips via sharp); patched in >=0.35.0.
  sharp: '>=0.35.0'
  # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849 (PostCSS sourceMappingURL file
  # disclosure); patched in >=8.5.18. Transitive via next/vite bundled postcss.
  postcss@<8.5.18: '>=8.5.18'
  # GHSA-3jxr-9vmj-r5cp (brace-expansion ReDoS) / js-yaml quadratic-CPU merge
  # keys — both dev-only, transitive via eslint/lhci/openapi-typescript/serwist.
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.7
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.3.0

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  # firebase 12.x ships a postinstall in @firebase/util that only writes a
  # config file when FIREBASE_WEBAPP_CONFIG is set (Firebase App Hosting
  # auto-init). This project configures Firebase via NEXT_PUBLIC_* env vars
  # and never sets that variable, so the script is a no-op — keep it denied.
  '@firebase/util': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
