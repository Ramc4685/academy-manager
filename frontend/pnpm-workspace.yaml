packages:
  - "."

minimumReleaseAge: 0

overrides:
  '@grpc/grpc-js': 1.9.16
  esbuild: 0.28.1
  tmp: 0.2.7
  'miniflare>ws': 8.21.0
  undici: ^7.28.0
  # CVE-2026-33327/33328/35590/35591 (libvips via sharp); patched in >=0.35.0.
  sharp: '>=0.35.0'
  # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849 (PostCSS path traversal via
  # sourceMappingURL auto-loading); patched in >=8.5.18. Transitive via
  # next's bundled postcss.
  postcss@<8.5.18: '>=8.5.18'
  # GHSA-3jxr-9vmj-r5cp (brace-expansion ReDoS) / js-yaml quadratic-CPU merge
  # keys — both dev-only, transitive via eslint/lhci/openapi-typescript/serwist.
  # GHSA-mh99-v99m-4gvg (brace-expansion unbounded-expansion OOM DoS) is
  # patched only in >=5.0.8, so the v5 range is bumped here; see auditConfig
  # below for why the 1.x/2.x ranges can't follow.
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.8
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.3.0

auditConfig:
  ignoreGhsas:
    # GHSA-mh99-v99m-4gvg (brace-expansion unbounded expansion -> OOM crash).
    # Fixed above for brace-expansion@5. The only remaining vulnerable copies
    # are 1.1.16 and 2.1.2, and upstream published no patched 1.x/2.x release —
    # 5.0.8 is the sole fixed version. They cannot be overridden to v5 because
    # v5's CommonJS entry exports an object ({ expand, EXPANSION_MAX, ... })
    # rather than the callable module.exports that their only consumers,
    # minimatch@3.1.5 and minimatch@5.1.9, invoke via
    # `require("brace-expansion")(...)` — forcing v5 there is a runtime break,
    # not a fix.
    #
    # Both residual paths are build-time only, reached exclusively through
    # @serwist/next's bundled glob@7/glob@9 (the Next PWA service-worker build
    # plugin). Nothing in that chain ships to the browser or runs in the
    # request path, and the glob patterns it expands are our own repo globs,
    # never attacker-controlled input. Re-evaluate when @serwist/next moves off
    # glob@7/@9 (which would pull minimatch@10 -> brace-expansion@5).
    - GHSA-mh99-v99m-4gvg

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  # firebase 12.x ships a postinstall in @firebase/util that only writes a
  # config file when FIREBASE_WEBAPP_CONFIG is set (Firebase App Hosting
  # auto-init). This project configures Firebase via NEXT_PUBLIC_* env vars
  # and never sets that variable, so the script is a no-op — keep it denied.
  '@firebase/util': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
