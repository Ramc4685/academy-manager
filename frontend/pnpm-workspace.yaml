packages:
  - "."

minimumReleaseAge: 0

overrides:
  '@grpc/grpc-js': 1.9.16
  esbuild: 0.28.1
  tmp: 0.2.7
  'miniflare>ws': 8.21.0
  undici: ^7.29.0
  ip-address: ^10.3.1
  nanoid@3: ^3.3.18
  nanoid@5: ^5.1.16
  protobufjs: ^7.6.5
  # CVE-2026-33327/33328/35590/35591 (libvips via sharp); patched in >=0.35.0.
  sharp: '>=0.35.0'
  # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849 (PostCSS path traversal via
  # sourceMappingURL auto-loading); patched in >=8.5.18. Transitive via
  # next's bundled postcss.
  postcss@<8.5.18: '>=8.5.18'
  # GHSA-3jxr-9vmj-r5cp (brace-expansion ReDoS) / js-yaml quadratic-CPU merge
  # keys — both dev-only, transitive via eslint/lhci/openapi-typescript/serwist.
  # GHSA-mh99-v99m-4gvg (brace-expansion unbounded-expansion OOM DoS) is
  # patched only in >=5.0.8, so the v5 range is bumped here; see auditConfig
  # below for why the 1.x/2.x ranges can't follow.
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  # GHSA-c83g-rgw3-j3cx (unbounded memory growth: no cache eviction on
  # distinct query results) / GHSA-73wf-gq98-2v4g (uncaught crash and
  # prototype write via untrusted browserslist-stats.json in normalizeStats).
  # Both patched in >=4.28.7. Transitive via @serwist/next; every other
  # consumer already resolved 4.28.7 before this pin.
  browserslist: '>=4.28.7'

# pnpm audit evaluates upstream declared ranges even when the lockfile applies
# the patched override. Each entry below is pinned above to a patched release.
auditConfig:
  ignoreGhsas:
    - GHSA-4cwx-7wf7-3272 # undici >=7.29.0
    - GHSA-mwp4-54f8-5fhr # ip-address >=10.3.1
    - GHSA-mh99-v99m-4gvg # brace-expansion 1.x/2.x/5.x patched pins
    - GHSA-rgw5-rvv9-x895 # brace-expansion >=5.0.9
    - GHSA-5p4m-2wfm-xmqj # js-yaml 3.15.1 / 4.3.1
    - GHSA-28wg-ghj8-5hjv # nanoid >=5.1.16
    - GHSA-2v37-7h3g-55p8 # nanoid >=3.3.18
  # The entry below is the exception: it has NO patched release to pin to.
  # GHSA-jmr9-qjv8-65gv (extract-zip <=2.0.1, unvalidated symlink path
  # traversal) names >=2.0.2 as patched, but 2.0.1 is still the latest version
  # published to the registry — there is nothing to upgrade or override to.
  # Dev-only and transitive: @lhci/cli -> lighthouse -> puppeteer-core ->
  # @puppeteer/browsers, and size-limit -> estimo -> find-chrome-bin ->
  # @puppeteer/browsers. It never reaches the deployed bundle. Remove this
  # entry once upstream publishes a fix or the puppeteer chain drops
  # extract-zip.
    - GHSA-jmr9-qjv8-65gv # extract-zip <=2.0.1, dev-only, no patched release

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  # firebase 12.x ships a postinstall in @firebase/util that only writes a
  # config file when FIREBASE_WEBAPP_CONFIG is set (Firebase App Hosting
  # auto-init). This project configures Firebase via NEXT_PUBLIC_* env vars
  # and never sets that variable, so the script is a no-op — keep it denied.
  '@firebase/util': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
