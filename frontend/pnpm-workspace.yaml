packages:
  - "."

minimumReleaseAge: 0

overrides:
  '@grpc/grpc-js': 1.9.16
  esbuild: 0.28.1
  tmp: 0.2.7
  'miniflare>ws': 8.21.0
  undici: ^7.28.0
  # GHSA-3jxr-9vmj-r5cp (brace-expansion ReDoS) / js-yaml quadratic-CPU merge
  # keys — both dev-only, transitive via eslint/lhci/openapi-typescript/serwist.
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.7
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.3.0

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
