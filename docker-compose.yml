services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        BFF_API_ORIGIN: http://backend:8001
        NEXT_PUBLIC_API_BASE: /api/v2
        NEXT_PUBLIC_FIREBASE_API_KEY: dummy
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: academy-courtmastr.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: academy-courtmastr
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: academy-courtmastr.firebasestorage.app
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "953230788846"
        NEXT_PUBLIC_FIREBASE_APP_ID: 1:953230788846:web:1f2819c11418ecf5860bff
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-Z6GS6WRZY8
        # "1" serves the Firebase sign-in helper first-party from the app
        # host (mobile Google sign-in fix); see DEPLOYMENT.md before enabling.
        NEXT_PUBLIC_FIREBASE_AUTH_PROXY: ${NEXT_PUBLIC_FIREBASE_AUTH_PROXY:-}
    restart: unless-stopped
    environment:
      BFF_API_ORIGIN: http://backend:8001
      PORT: "3001"
    ports:
      - "3000:3001"
    depends_on:
      - backend

volumes:
  mongo_data:
