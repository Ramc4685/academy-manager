app = "courtmastr-academy-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DB_NAME = "academy_manager"
  COOKIE_SECURE = "true"
  FIREBASE_AUTH_ENABLED = "true"
  FIREBASE_PROJECT_ID = "academy-courtmastr"
  V2_EMAIL_DELIVERY_ENABLED = "true"
  FRONTEND_URL = "https://academy.courtmastr.com"
  CORS_ORIGINS = "https://academy.courtmastr.com"
  SCHEDULER_TZ = "America/Chicago"
  V2_ENV = "prod"
  APP_TENANCY_MODE = "single_academy"
  PRIMARY_ACADEMY_ID = "acad_blno_badminton"
  ENABLE_PLATFORM_ROUTES = "false"
  ENABLE_OWNER_ROLE = "false"
  ENABLE_STUDENT_LOGIN = "false"
  V2_RUN_MIGRATIONS_ON_BOOT = "true"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v2/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
