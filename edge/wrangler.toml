name = "academy-edge-router"
main = "router.ts"
compatibility_date = "2026-05-16"

# Deprecated. Production traffic is served directly by the `academy-next`
# Cloudflare Worker configured in `frontend-next/wrangler.jsonc`.
routes = []

[vars]
API_ORIGIN = "http://127.0.0.1:8001"
WEB_ORIGIN = "http://localhost:3001"

[env.prod]
name = "academy-edge-router"
routes = []

[env.prod.vars]
API_ORIGIN = "https://api.academy.courtmastr.com"
WEB_ORIGIN = "https://academy.courtmastr.com"

[observability]
enabled = true
