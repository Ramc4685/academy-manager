name = "academy-edge-router"
main = "router.ts"
compatibility_date = "2026-05-16"

# Bind this worker to the production hostname when the v2 canary starts.
routes = [
  { pattern = "academy.courtmastr.com/*", zone_name = "courtmastr.com" }
]

[vars]
API_ORIGIN = "http://127.0.0.1:8001"
WEB_ORIGIN = "http://localhost:3001"

[env.prod]
name = "academy-edge-router"
routes = [
  { pattern = "academy.courtmastr.com/*", zone_name = "courtmastr.com" }
]

[env.prod.vars]
API_ORIGIN = "https://courtmastr-academy-api.fly.dev"
WEB_ORIGIN = "https://academy-next.courtmastr.com"

[observability]
enabled = true
