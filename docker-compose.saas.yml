# SaaS staging overlay for local Docker. Apply with:
#
#   docker compose -p saas-staging -f docker-compose.yml -f docker-compose.saas.yml up -d --build
#
# The `-p saas-staging` project name keeps this stack isolated from a default
# `docker compose up` dev stack so they can coexist (different volumes, no
# port clashes provided the dev stack is down or uses different ports).
#
# Composes on top of the existing services in `docker-compose.yml`:
#  - mongo:     unchanged image, isolated volume
#  - backend:   runs backend.v2.main:app with V2_SAAS_MODE=true, Firebase emulator
#  - frontend:  rebuilt to point at the Firebase emulator at build time
#                (NEXT_PUBLIC_* values are baked into the Next.js bundle)
#  - firebase-emulator: NEW — Firebase Auth emulator (auth only)
#
# What this overlay does NOT do:
#  - Real DNS / subdomain resolution (use `docker-compose.tunnel.yml` for that)
#  - Real CORS across distinct hostnames
#  - Backup/restore drill against managed Mongo

services:
  mongo:
    # Keep the same image; use an isolated volume for the SaaS DB so this
    # stack does not collide with the dev compose `mongo_data` volume.
    volumes:
      - mongo_saas_data:/data/db
    ports:
      # Expose to host so scripts/dev/seed_saas_staging.py can reach it
      # from the host venv. Loopback-only — bind to 127.0.0.1.
      - "127.0.0.1:27017:27017"

  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    restart: unless-stopped
    working_dir: /workspace
    user: "node"
    volumes:
      # Config (firebase.json, .firebaserc) — read-only is fine.
      - ./firebase-emulator/firebase.json:/workspace/firebase.json:ro
      - ./firebase-emulator/.firebaserc:/workspace/.firebaserc:ro
    command:
      - firebase
      - emulators:start
      - --only=auth
      - --project=academy-courtmastr
    ports:
      # 9099 = auth emulator, 4000 = emulator UI
      - "9099:9099"
      - "4000:4000"
    healthcheck:
      # The andreysenov/firebase-tools image has no curl/wget — use node.
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:9099/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    depends_on:
      mongo:
        condition: service_started
      firebase-emulator:
        condition: service_healthy
    env_file:
      # Auto-generated by scripts/dev/saas_staging.sh on `up`.
      # Contains random local-only secrets used by staging seed helpers.
      - path: ./.local/saas-staging.env
        required: true
    environment:
      # --- Wave 7 SaaS contract (non-secret config) ---
      V2_SAAS_MODE: "true"
      V2_ENV: "staging"
      V2_MONGO_URL: "mongodb://mongo:27017"
      V2_MONGO_DB: "academy_manager_saas_staging"
      V2_ALLOWED_INTERNAL_TENANT_HEADER: "x-internal-tenant-id"
      V2_STRIPE_USE_FAKE_GATEWAY: "true"
      V2_STRIPE_API_KEY: ""
      V2_STRIPE_WEBHOOK_SECRET: ""
      # --- Legacy backend env (non-secret) ---
      APP_ENV: "staging"
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "academy_manager_saas_staging"
      ADMIN_EMAIL: "admin@acme-saas-staging.dev"
      COOKIE_SECURE: "false"
      SEED_DEMO_ACCOUNTS: "false"
      # --- Firebase: emulator, not real ---
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: "academy-courtmastr"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulator:9099"
      # --- CORS / origins ---
      FRONTEND_URL: "http://localhost:3000"
      CORS_ORIGINS: "http://localhost:3000,http://acme.localhost:3000,http://127.0.0.1:3000"
      # --- Email: never live in staging ---
      EMAIL_DELIVERY_MODE: "disabled"
      RESEND_API_KEY: ""

  frontend:
    build:
      context: ./frontend
      args:
        BFF_API_ORIGIN: http://backend:8001
        NEXT_PUBLIC_API_BASE: /api/v2
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: academy-courtmastr.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: academy-courtmastr
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: academy-courtmastr.firebasestorage.app
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "953230788846"
        NEXT_PUBLIC_FIREBASE_APP_ID: 1:953230788846:web:1f2819c11418ecf5860bff
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-Z6GS6WRZY8
        # NOTE: frontend reaches the emulator via the host port, not the
        # docker-internal hostname, because this URL is used by the browser.
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "http://localhost:9099"
    environment:
      BFF_API_ORIGIN: http://backend:8001
      PORT: "3001"
    ports:
      # Expose on host 3000 to match CORS / smoke defaults.
      - "3000:3001"

volumes:
  mongo_saas_data:
